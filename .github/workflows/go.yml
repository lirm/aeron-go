name: Go

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.21

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: Cache aeron-all jar for cluster system tests
      uses: actions/cache@v4
      with:
        path: systests/cluster/aeron-all-1.52.0.jar
        key: aeron-all-1.52.0

    - name: Fetch aeron-all jar for cluster system tests
      run: |
        if [ ! -f systests/cluster/aeron-all-1.52.0.jar ]; then
          curl -fL -o systests/cluster/aeron-all-1.52.0.jar \
            https://repo1.maven.org/maven2/io/aeron/aeron-all/1.52.0/aeron-all-1.52.0.jar
        fi

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...
